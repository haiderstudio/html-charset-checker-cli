<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bad example</title>
</head>
<body>
  <p>This page declares no charset at all, so the browser has to
  guess — and the guess is wrong often enough that accented names
  and emoji turn into garbled characters.</p>
</body>
</html>
