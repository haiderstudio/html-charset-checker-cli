<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="iso-8859-1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge-case example</title>
</head>
<body>
  <p>This page does declare a charset — but it declares iso-8859-1,
  not UTF-8, so any character outside that older set still comes out
  wrong.</p>
</body>
</html>
